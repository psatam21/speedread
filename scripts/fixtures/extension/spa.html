<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>SPA view A</title></head>
  <body>
    <main id="app">
      <article>
        <h1>View A headline</h1>
        <p>View A is the first screen of a single page application. It has enough words in it to be picked as the main content of the page by the extractor.</p>
      </article>
    </main>
    <button id="go" type="button">Next view</button>
    <script>
      document.getElementById('go').addEventListener('click', () => {
        history.pushState({}, '', '/spa/view-b');
        document.title = 'SPA view B';
        document.getElementById('app').innerHTML =
          '<article><h1>View B headline</h1><p>View B replaced the first screen without a page load. Readers expect the extension to pick up whatever is on screen right now, not the stale first view.</p></article>';
      });
    </script>
  </body>
</html>
