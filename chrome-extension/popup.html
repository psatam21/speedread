<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BriskRead</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/ui.css" />
    <script src="lib/page-theme.js"></script>
  </head>
  <body class="popup">
    <header class="p-head">
      <img src="icons/icon48.png" alt="" width="28" height="28" />
      <strong>BriskRead</strong>
      <span class="ver" id="ver"></span>
    </header>

    <section class="p-section" aria-labelledby="this-page">
      <div class="p-page">
        <span class="eyebrow" id="this-page">This page</span>
        <span class="p-title" id="tab-title">…</span>
      </div>
      <button type="button" class="btn btn-primary btn-lg" id="btn-read">
        <span id="read-label">Speed read this page</span><kbd data-cmd="speed-read-tab"></kbd>
      </button>
      <div class="p-actions">
        <button type="button" class="btn btn-secondary" id="btn-bionic">Bionic page <kbd data-cmd="bionic-tab"></kbd></button>
        <button type="button" class="btn btn-secondary" id="btn-save">Read later <kbd data-cmd="read-later-tab"></kbd></button>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="p-section" aria-labelledby="queue-title">
      <div class="queue-head">
        <span class="eyebrow" id="queue-title">Read later <span id="queue-count"></span></span>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-file">Open a PDF or paste text</button>
      </div>
      <p class="empty-q" id="queue-empty">Nothing saved yet. Press Alt+Shift+L on any page to save it here.</p>
      <ul class="queue" id="queue" aria-label="Read later queue"></ul>
    </section>

    <footer class="p-foot">
      <a href="#" id="link-options">Options</a>
      <a href="#" id="link-shortcuts">Shortcuts</a>
      <a href="https://briskread.com" target="_blank" rel="noopener">briskread.com</a>
      <a href="https://briskread.com/privacy" target="_blank" rel="noopener">Privacy</a>
    </footer>
    <script src="lib/ext-core.js"></script>
    <script src="lib/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
