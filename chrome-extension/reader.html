<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BriskRead Reader</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/ui.css" />
    <script src="lib/page-theme.js"></script>
  </head>
  <body class="page">
    <main class="landing" id="landing" hidden>
      <header class="brandbar">
        <img src="icons/icon48.png" alt="" width="32" height="32" />
        <span>BriskRead</span>
      </header>
      <p class="notice" id="notice" role="status" hidden></p>
      <section class="card">
        <h1>Read anything</h1>
        <p class="hint">Paste text, or open a PDF from your computer. Nothing leaves this browser.</p>
        <textarea id="paste" rows="8" placeholder="Paste an article, email or notes…" aria-label="Text to read"></textarea>
        <div class="row">
          <button type="button" class="btn btn-primary" id="btn-paste">Speed read text</button>
          <label class="btn btn-secondary" for="file">Open a PDF…</label>
          <input type="file" id="file" accept="application/pdf,.pdf,text/plain,.txt" hidden />
        </div>
        <p class="hint drop-hint">Or drop a PDF anywhere on this page.</p>
      </section>
    </main>
    <div class="loading" id="loading" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="loading-text">Reading PDF…</span></div>
    <script src="lib/reader-core.js"></script>
    <script src="lib/ext-core.js"></script>
    <script src="lib/storage.js"></script>
    <script src="reader-page.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
